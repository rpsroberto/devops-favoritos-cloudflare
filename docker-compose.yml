services:
  postgres:
    image: postgres:16-alpine
    container_name: devops-favoritos-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: devops_favoritos
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d devops_favoritos"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: devops-favoritos-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/devops_favoritos?schema=public
      PORT: 3333
      FRONTEND_URL: http://localhost:5173
      FAKE_STORE_API_URL: https://fakestoreapi.com
    ports:
      - "3333:3333"

  frontend:
    build:
      context: ./frontend
    container_name: devops-favoritos-frontend
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://localhost:3333
    ports:
      - "5173:5173"

volumes:
  postgres_data:
