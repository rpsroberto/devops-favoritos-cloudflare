name: CI/CD

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  validate:
    name: Validar backend e frontend
    runs-on: ubuntu-latest

    steps:
      # Baixa o código do repositório para o runner do GitHub Actions.
      - name: Checkout do repositório
        uses: actions/checkout@v4

      # Configura uma versão estável do Node.js para build das duas aplicações.
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Instala dependências do backend de forma reprodutível usando package-lock.json.
      - name: Instalar dependências do backend
        working-directory: backend
        run: npm ci

      # Gera o Prisma Client e valida o TypeScript do backend.
      - name: Build do backend
        working-directory: backend
        run: |
          npx prisma generate
          npm run build

      # Instala dependências do frontend.
      - name: Instalar dependências do frontend
        working-directory: frontend
        run: npm ci

      # Executa o build de produção do React/Vite.
      - name: Build do frontend
        working-directory: frontend
        run: npm run build

  deploy-cloudflare-pages:
    name: Deploy frontend Cloudflare Pages
    runs-on: ubuntu-latest
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar e buildar frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      # Requer configurar os secrets CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID.
      # O nome do projeto deve existir no Cloudflare Pages ou ser criado no primeiro deploy.
      - name: Publicar no Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy frontend/dist --project-name=devops-favoritos-cloudflare
